name: flutter_hw2_frieren
description: "copy web to app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  video_player: ^2.8.3
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand_bar/msi_logo.png
    - assets/images/body/ProductContent/nv.webp
    - assets/images/body/ProductContent/frieren-edition-title-tc.webp
    - assets/images/body/ProductContent/frieren.webp
    - assets/images/body/ProductContent/vga.webp
    - assets/images/body/ProductContent/title.webp
    - assets/images/body/ProductContent/bg.mp4
    - assets/images/body/ProductDescription/商品介紹-bg.png
    - assets/images/body/DesignDetails/highlight-front.webp
    - assets/images/body/DesignDetails/highlight-back.webp
    - assets/images/body/DesignDetails/sw1.webp
    - assets/images/body/DesignDetails/highlight-down.webp
    - assets/images/body/DesignDetails/highlight-down-hot.png
    - assets/images/body/SetContent/acc-box01.webp
    - assets/images/body/SetContent/acc-box02.webp
    - assets/images/body/SetContent/acc-box03.png
    - assets/images/body/SetContent/set_text_bg.png
    - assets/images/body/ProductContent/cooling_bg.png
    - assets/images/body/ProductContent/frozr-vga.webp
    - assets/images/body/ProductContent/ad.png
    - assets/images/body/ProductContent/Partner_merchants.png
    - assets/images/body/PictureDescriptionSection/set1.webp
    - assets/images/body/PictureDescriptionSection/card1.webp
    - assets/images/body/PictureDescriptionSection/card2.webp
    - assets/images/body/PictureDescriptionSection/card3.webp
    - assets/images/body/PictureDescriptionSection/card4.webp


flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/start_up/frieren_icon.jpg"

flutter_native_splash:
  # 背景顏色設定為全黑
  color: "#000000"
  
  image: assets/images/start_up/frieren_icon.jpg
  
  android_12:
    image: assets/images/start_up/frieren_icon.jpg
    color: "#000000"
    icon_background_color: "#000000"

  fullscreen: true